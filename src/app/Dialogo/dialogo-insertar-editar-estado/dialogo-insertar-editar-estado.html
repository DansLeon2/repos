
<div mat-dialog-content>

  <form [formGroup]="formEstado">
    <mat-grid-list cols="1" rowHeight="100px">
      <mat-grid-tile>
          <mat-form-field appearance="outline">
             <mat-label>Nombre Estado</mat-label>
            <input matInput formControlName="nombre" autocomplete="off">
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile>
          <mat-form-field appearance="outline">
             <mat-label>Nombre Descripcion</mat-label>
            <input matInput formControlName="descripcion" autocomplete="off">
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile>
          <mat-form-field appearance="outline">
             <mat-label>Estado Activo</mat-label>
            <input matInput formControlName="activo" autocomplete="off">
          </mat-form-field>
      </mat-grid-tile> 
    </mat-grid-list>

  </form>

</div>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" 
    (click)="agregarInsertarEstado()"
    [disabled]="formEstado.invalid">
    {{tituloBoton}}
  </button>
  <button mat-raised-button mat-dialog-close color="red">Regresar</button>
</div>
